name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  evals:
    runs-on: ubuntu-latest
    needs: check
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run evals on the frozen snapshots
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          npm run evals
          {
            echo "## Eval results"
            echo
            cat evals/results/latest.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Skip evals (no ANTHROPIC_API_KEY secret)
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::Evals skipped. Add an ANTHROPIC_API_KEY repository secret to run them on every pull request."
      - uses: actions/upload-artifact@v4
        if: always() && env.ANTHROPIC_API_KEY != ''
        with:
          name: eval-results
          path: evals/results/
